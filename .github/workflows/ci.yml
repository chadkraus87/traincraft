name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check migration files are complete (no gaps)
        run: npm run check:migrations

      - name: Unit tests (safety engine, QA validator, PDF, builder guard)
        run: npm test

      - name: Database tests (real embedded Postgres, all migrations)
        run: npm run test:db

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          ANTHROPIC_API_KEY: dummy
